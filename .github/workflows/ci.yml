# CI for every PR and every push to main (docs/plans/phase-a/a1-ci.md; design bible §8).
# Checks that don't need a Mac or Blender. Each job is independent: to add one (gdUnit4, the navmesh
# bake, the asset import path, replays), append a job below; a job that needs Godot copies the
# container block (same image and digest) and the "Install Python" and import steps from `import`.
# The image is barichello/godot-ci 4.7.2 pinned by digest (the env context isn't available in
# `container:`, so the digest is repeated per job); bump the tag and digest with the editor.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail, so a failing command before `| tee` fails its step

# Every Godot call goes through scripts/tools/godot_timeout.sh (a hung Godot fails with 124, naming the
# call and its limit); tests/run.sh and run_scenario.sh limit their own calls.

env:
  # Playtest and test runs never share the human's user://save.json.
  WHISKEYJACK_SAVE_SLOT: ci

jobs:
  import:
    name: import (errors and warnings baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python and fontconfig
        # Without libfontconfig Godot logs "Unable to load fontconfig" as an ERROR on every run.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 libfontconfig1
      - name: Restore the import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-4.7.2-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-4.7.2-
      - name: Import, first run (a fresh checkout reports missing UID-cache errors; not checked)
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_IMPORT 900 "first import" godot --headless --path . --import < /dev/null 2>&1 | tee import-1.log
      - name: Import, second run (checked)
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_IMPORT 900 "second import" godot --headless --path . --import < /dev/null 2>&1 | tee import-2.log
      - name: Compile every .dialogue file and name each syntax error's line (ci/check_dialogue.gd)
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "check_dialogue" godot --headless --path . -s ci/check_dialogue.gd < /dev/null 2>&1 | tee check-dialogue.log
      - name: Load every script and scene, with GDScript warnings on (-d)
        # -d prints GDScript warnings; stdin is /dev/null so the debugger never waits at a debug> prompt.
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "load_all" godot --headless --path . -d -s ci/load_all.gd < /dev/null 2>&1 | tee load-all.log
      - name: Check the logs (no errors; warnings match ci/warnings-baseline.txt)
        if: ${{ !cancelled() }}
        run: python3 ci/check_log.py --baseline ci/warnings-baseline.txt import-2.log check-dialogue.log load-all.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-logs
          path: "*.log"
          retention-days: 14

  validate:
    name: validate (committed assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        run: command -v python3 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends python3)
      - name: Test the sourced-asset licence rules (CC0 only; ci/test_sources.py)
        run: python3 ci/test_sources.py
      - name: Test the brush-map writer and check committed .map files match their layouts
        run: python3 tests/tools/test_brush_boxes.py
      - name: Test the Godot and Blender call timeouts, including the expiry path (scripts/tools/godot_timeout.*)
        run: python3 tests/tools/test_godot_timeout.py
      - name: Test the judge's game-path motion assertions (scripts/judge.py)
        run: python3 tests/tools/test_judge_motion.py
      - name: Test the brief's parts schema (scripts/pipeline.py)
        run: python3 tests/tools/test_brief_parts.py
      - name: Test the brief's smooth_shading flag (scripts/pipeline.py)
        run: python3 tests/tools/test_brief_shading.py
      - name: Run scripts/godot_validate.gd on every asset with a brief, plus the assets/sources.json check (no Blender renders)
        run: python3 ci/validate_assets.py
      - name: Test the 3D texture import settings and check the committed ones (scripts/tools/texture_imports.py)
        # A texture still awaiting the editor's 3D detection gets its .import rewritten in every checkout
        run: python3 tests/tools/test_texture_imports.py && python3 scripts/tools/texture_imports.py --check
      - name: Check the generated surface textures against their graphs, ramps and manifest (scripts/tools/make_textures.py --check)
        # Verify only: regenerating needs Material Maker on a Mac. Fails on hand-edited or stale textures.
        run: python3 scripts/tools/make_textures.py --check

  data-lint:
    name: data-lint (dialogues, quests and the backlog)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint data/dialogues (.dialogue) and data/quests (baseline ci/data-lint-baseline.txt)
        run: python3 ci/data_lint.py
      - name: Test the dialogue lint's QuestManager member check (ci/data_lint.py)
        run: python3 tests/tools/test_data_lint.py
      - name: Test the backlog tool (scripts/tools/backlog.py)
        run: python3 tests/tools/test_backlog.py
      - name: Lint docs/backlog (schema, after links and cycles, design-bible target IDs, PRs on finished items)
        run: |
          python3 scripts/tools/backlog.py lint
          { echo '### Backlog'; python3 scripts/tools/backlog.py status; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint (gdformat and gdlint, as .githooks/pre-commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gdtoolkit (pinned)
        run: pipx install gdtoolkit==4.5.0
      - name: gdformat --check and gdlint on every script outside addons/ (config in gdlintrc)
        run: |
          git ls-files -z '*.gd' ':!addons/**' | xargs -0 gdformat --check --line-length=120
          git ls-files -z '*.gd' ':!addons/**' | xargs -0 gdlint

  hooks:
    name: hooks (Godot MCP guard tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test .claude/hooks/godot_ai_guard.py
        run: python3 .claude/hooks/test_godot_ai_guard.py

  gdunit4:
    name: gdunit4 (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python and fontconfig
        # Without libfontconfig Godot logs "Unable to load fontconfig" as an ERROR on every run.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 libfontconfig1
      - name: Restore the import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-4.7.2-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-4.7.2-
      - name: Import (registers the gdUnit4 and project class names)
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_IMPORT 900 "import" godot --headless --path . --import < /dev/null 2>&1 | tee import.log
      - name: Run the gdUnit4 suites under tests/ (tests/run.sh; pending design targets are skipped)
        run: GODOT_BIN="$(command -v godot)" tests/run.sh 2>&1 | tee gdunit4.log
      - name: Keep the JUnit and HTML reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdunit4-reports
          path: |
            reports/
            gdunit4.log
      - name: Summarise the results on the run page and annotate failing tests (JUnit)
        # Parity with godot-gdunit-labs/gdUnit4-action's report, keeping tests/run.sh as the one runner.
        # annotate_only: annotations and the job summary need no extra token permissions.
        # require_tests: fails the step if no results parsed, so a runner that silently ran nothing fails.
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: reports/report_*/results.xml
          annotate_only: true
          detailed_summary: true
          require_tests: true
          fail_on_parse_error: true
          check_name: gdUnit4

  navmesh:
    name: navmesh (stale bake, pathfinding, path clearance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python and fontconfig
        # Without libfontconfig Godot logs "Unable to load fontconfig" as an ERROR on every run.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 libfontconfig1
      - name: Restore the import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-4.7.2-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-4.7.2-
      - name: Import
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_IMPORT 900 "import" godot --headless --path . --import < /dev/null 2>&1 | tee import.log
      - name: Rewrite the held-prop wrappers and fail if a committed one is stale
        # scripts/tools/make_held_props.gd is the only writer of scenes/props/Held*.tscn; it keeps node ids
        # across runs, so a rerun is byte-identical.
        run: |
          mkdir -p /tmp/committed-props
          cp scenes/props/Held*.tscn /tmp/committed-props/
          scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "make_held_props" godot --headless --path . -s res://scripts/tools/make_held_props.gd < /dev/null 2>&1 | tee props.log
          stale=0
          for f in /tmp/committed-props/*.tscn; do diff -u "$f" "scenes/props/$(basename "$f")" || stale=1; done
          if [ "$stale" = 1 ]; then
            echo "::error::Stale held-prop scene: run godot --headless --path . -s res://scripts/tools/make_held_props.gd and commit the result"
            exit 1
          fi
      - name: Rebuild the brush maps (func_godot, trial B2) and fail if a committed build is stale
        # scripts/tools/build_brush_maps.gd is the only writer of the scenes it builds from .map files.
        # It runs before the navmesh bake, which reads the built scenes.
        run: |
          built="scenes/world/trials/CryptTrial_brushes.tscn"
          mkdir -p /tmp/committed-brushes
          for f in $built; do cp --parents "$f" /tmp/committed-brushes/; done
          scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "build_brush_maps" godot --headless --path . -s res://scripts/tools/build_brush_maps.gd < /dev/null 2>&1 | tee brushes.log
          stale=0
          for f in $built; do diff -u "/tmp/committed-brushes/$f" "$f" | cut -c1-200 | head -40 || stale=1; done
          if [ "$stale" = 1 ]; then
            echo "::error::Stale brush build: run godot --headless --path . -s res://scripts/tools/build_brush_maps.gd and commit the result"
            exit 1
          fi
      - name: Rebake the navmeshes and fail if the committed bake is stale
        # scripts/tools/bake_navmeshes.gd is the only writer of scenes/world/*_navmesh.tres (and the
        # trial's scenes/world/trials/*_navmesh.tres).
        run: |
          mkdir -p /tmp/committed
          for f in scenes/world/*_navmesh.tres scenes/world/Level*.tscn scenes/world/trials/*_navmesh.tres scenes/world/trials/CryptTrial.tscn; do
            cp --parents "$f" /tmp/committed/
          done
          scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "bake_navmeshes" godot --headless --path . -s res://scripts/tools/bake_navmeshes.gd < /dev/null 2>&1 | tee bake.log
          stale=0
          for f in $(cd /tmp/committed && find . -type f); do
            diff -u "/tmp/committed/$f" "$f" || stale=1
          done
          if [ "$stale" = 1 ]; then
            echo "::error::Stale navmesh bake: run godot --headless --path . -s res://scripts/tools/bake_navmeshes.gd and commit the result"
            exit 1
          fi
      - name: Enemies path-find on the baked navmeshes (no runtime bake)
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "test_enemy_pathfinding" godot --headless --path . -s res://tests/test_enemy_pathfinding.gd < /dev/null 2>&1 | tee pathfinding.log
      - name: No runtime-bake warnings in the bake or level runs
        run: |
          if grep -E "parse RenderingServer meshes|is ceiled to cell" bake.log pathfinding.log; then
            echo "::error::A navmesh bake warning is back (design bible section 8)"
            exit 1
          fi
      - name: Path clearance (lvl_path_clearance_min; report-only until the level fixes land)
        run: |
          scripts/tools/godot_timeout.sh GODOT_TIMEOUT_RUN 600 "check_path_clearance" godot --headless --path . -s res://scripts/tools/check_path_clearance.gd -- --out=clearance.json < /dev/null 2>&1 | tee clearance.log
          { echo '### Path clearance (lvl_path_clearance_min >= 1.0 m)'; echo '```'; grep -E '^(res://|  )' clearance.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs and the clearance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navmesh-logs
          path: |
            *.log
            clearance.json
          retention-days: 14

  replays:
    name: replays (scenarios, determinism, design-bible metrics)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python and fontconfig
        # Without libfontconfig Godot logs "Unable to load fontconfig" as an ERROR on every run.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 libfontconfig1
      - name: Test the metrics script on its fixture logs (tests/replay/)
        run: python3 tests/replay/test_replay_metrics.py
      - name: Restore the import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-4.7.2-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-4.7.2-
      - name: Import
        run: scripts/tools/godot_timeout.sh GODOT_TIMEOUT_IMPORT 900 "import" godot --headless --path . --import < /dev/null 2>&1 | tee import.log
      - name: Run every scenario twice headless, compare the logs and check the targets (no capture)
        # Rendered capture (scripts/review/capture_evidence.sh) stays on the Mac: llvmpipe colours differ.
        run: GODOT_BIN="$(command -v godot)" scripts/review/run_scenario.sh tests/scenarios/*.json 2>&1 | tee replays.log
      - name: Summarise the metrics
        if: ${{ !cancelled() }}
        run: |
          { echo '### Replay metrics (design bible §9)'; echo '```'; grep -E '^(==|compare|  [A-Z]{4,})' replays.log | sed "s|$PWD/||g"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the event logs and metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replays
          path: |
            .replay-out/
            replays.log
          include-hidden-files: true
          retention-days: 14
