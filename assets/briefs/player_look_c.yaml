# spike-target-look concept variant C (docs/trials/target-look.md): Elden Ring wanderer: thick hooded shoulder cape, high-collared padded coat, iron greaves.
# A look-dev brief: concepts only until the user picks a style anchor; the winner's model is built into the
# gitignored assets/lookdev/ and never replaces the shipped player. Copied from assets/briefs/player.yaml.
# The art bible is the only source for these numbers: change it there first, then copy here.
asset_id: player_look_c
type: character
brief: |
  The player, a Frontier Line soldier, in the target look (Souls series and The Witcher: dark epic
  fantasy). The camera sits behind them, so the back and shoulders read most.
prompt: |
  A lone wandering soldier, natural adult proportions, tall and lean. A thick Peat Black wool shoulder
  cape, hood lowered, over the shoulders and upper back. Beneath it a knee-length Garrison Teal padded
  coat with a high collar and a wide Saddle Leather belt, Blackened Iron vambraces and greaves, Saddle
  Leather boots. Dark hair tied back, a gaunt weathered face, one small Tarnished Gold collar clasp.
  Muted, dark colours. Empty open hands, T-pose.
face_limit: 5000
tripo_model: P1-20260311
triangle_budget: 5500
texture_size: 1024
target_size_m: 1.8
pivot: base
palette: [Garrison Teal, Peat Black, Saddle Leather, Blackened Iron, Tarnished Gold]
animations: [idle, run, dodge_roll, attack_light, attack_heavy, death]
# Every variant keeps a knee-length skirt (gambeson, tabard, coat or tunic), so the standard skirt step applies.
skirt_reweight: true
smooth_shading: true
bone_map: data/rigs/mixamorig_bone_map.tres
